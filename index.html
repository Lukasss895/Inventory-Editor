<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS:GO Offline Inventory Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0f17;
      color: #e2e8f0;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* CS:GO Item Rarity Borders & Accents */
    .rarity-2 { border-color: #4b69ff; } /* Mil-Spec */
    .rarity-3 { border-color: #8847ff; } /* Restricted */
    .rarity-4 { border-color: #d32ce6; } /* Classified */
    .rarity-5 { border-color: #eb4b4b; } /* Covert */
    .rarity-6 { border-color: #ffd700; } /* Knife / Gold */

    .rarity-bg-2 { background: linear-gradient(180deg, rgba(75, 105, 255, 0.08) 0%, rgba(15, 23, 42, 0.6) 100%); }
    .rarity-bg-3 { background: linear-gradient(180deg, rgba(136, 71, 255, 0.08) 0%, rgba(15, 23, 42, 0.6) 100%); }
    .rarity-bg-4 { background: linear-gradient(180deg, rgba(211, 44, 230, 0.08) 0%, rgba(15, 23, 42, 0.6) 100%); }
    .rarity-bg-5 { background: linear-gradient(180deg, rgba(235, 75, 75, 0.08) 0%, rgba(15, 23, 42, 0.6) 100%); }
    .rarity-bg-6 { background: linear-gradient(180deg, rgba(255, 215, 0, 0.12) 0%, rgba(15, 23, 42, 0.6) 100%); }

    /* Glassmorphic Cards */
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #090d16; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <!-- TOP HEADER NAVBAR -->
  <header class="glass-panel sticky top-0 z-40 px-6 py-3.5 flex justify-between items-center border-b border-slate-800/80">
    <div class="flex items-center space-x-3">
      <div class="bg-gradient-to-tr from-amber-600 to-amber-400 text-slate-950 p-2 rounded-lg font-black text-xl shadow-lg shadow-amber-500/10">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <div>
        <h1 class="text-base font-bold text-white tracking-wide uppercase">CS:GO Inventory Configurator</h1>
        <p class="text-xs text-slate-400">Offline <span class="font-mono text-amber-400">inventory.txt</span> KeyValues Generator</p>
      </div>
    </div>

    <!-- QUICK ACTIONS HEADER -->
    <div class="flex items-center space-x-3">
      <button onclick="copyToClipboard()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold px-4 py-2 rounded-lg text-xs flex items-center space-x-2 transition border border-slate-700/60 shadow-sm">
        <i class="fa-solid fa-copy text-amber-400"></i>
        <span>Copy KeyValues</span>
      </button>
      <button onclick="downloadInventoryFile()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-lg text-xs flex items-center space-x-2 transition shadow-md shadow-amber-500/10">
        <i class="fa-solid fa-download"></i>
        <span>Download inventory.txt</span>
      </button>
    </div>
  </header>

  <!-- MAIN LAYOUT -->
  <main class="flex-1 max-w-[1600px] w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- LEFT COLUMN: ADD / EDIT ITEM FORM -->
    <div class="lg:col-span-4 space-y-5">
      
      <!-- ADD ITEM CARD -->
      <div class="glass-panel rounded-2xl p-5 space-y-4">
        <div class="flex items-center justify-between pb-3 border-b border-slate-800/80">
          <h2 class="text-sm font-bold text-white uppercase tracking-wider flex items-center space-x-2">
            <i class="fa-solid fa-square-plus text-amber-400"></i>
            <span>Add Item to Inventory</span>
          </h2>
          <span class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded font-mono">2016 Schema</span>
        </div>

        <div class="space-y-3">
          
          <!-- PRESET SELECTOR -->
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Preset Items</label>
            <select id="preset-select" onchange="loadPresetItem()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-amber-500 transition">
              <optgroup label="--- Rare Knives ---">
                <option value="515_38">★ Butterfly Knife | Fade</option>
                <option value="515_418">★ Butterfly Knife | Doppler Phase 1</option>
                <option value="507_38">★ Karambit | Fade</option>
                <option value="507_44">★ Karambit | Case Hardened</option>
                <option value="508_419">★ M9 Bayonet | Doppler Phase 2</option>
                <option value="508_12">★ M9 Bayonet | Crimson Web</option>
                <option value="500_415">★ Bayonet | Ruby</option>
                <option value="506_38">★ Flip Knife | Fade</option>
                <option value="505_418">★ Gut Knife | Doppler</option>
                <option value="512_38">★ Huntsman Knife | Fade</option>
                <option value="509_38">★ Falchion Knife | Fade</option>
                <option value="516_12">★ Shadow Daggers | Crimson Web</option>
                <option value="514_38">★ Bowie Knife | Fade</option>
              </optgroup>
              <optgroup label="--- Primary Rifles & Snipers ---">
                <option value="7_38">AK-47 | Redline</option>
                <option value="7_180">AK-47 | Fire Serpent</option>
                <option value="7_300">AK-47 | Vulcan</option>
                <option value="7_490">AK-47 | Frontside Misty</option>
                <option value="16_255">M4A4 | Asiimov</option>
                <option value="16_309">M4A4 | Howl</option>
                <option value="60_440">M4A1-S | Golden Coil</option>
                <option value="60_321">M4A1-S | Cyrex</option>
                <option value="60_430">M4A1-S | Hyper Beast</option>
                <option value="9_344">AWP | Dragon Lore</option>
                <option value="9_279">AWP | Asiimov</option>
                <option value="9_422">AWP | Hyper Beast</option>
                <option value="9_38">AWP | Lightning Strike</option>
              </optgroup>
              <optgroup label="--- Pistols & SMGs ---">
                <option value="1_180">Desert Eagle | Hypnotic</option>
                <option value="1_351">Desert Eagle | Conspiracy</option>
                <option value="1_470">Desert Eagle | Sunset Storm</option>
                <option value="4_38">Glock-18 | Fade</option>
                <option value="4_353">Glock-18 | Water Elemental</option>
                <option value="61_501">USP-S | Kill Confirmed</option>
                <option value="19_233">P90 | Asiimov</option>
              </optgroup>
              <optgroup label="--- Containers & Keys ---">
                <option value="4001_0">CS:GO Weapon Case</option>
                <option value="4004_0">Operation Bravo Case</option>
                <option value="4008_0">eSports 2013 Winter Case</option>
                <option value="1201_0">CS:GO Case Key</option>
              </optgroup>
            </select>
          </div>

          <!-- FORM FIELDS -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[11px] font-semibold text-slate-400 mb-1">Def Index</label>
              <input type="number" id="input-def-index" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 font-mono text-xs text-white focus:outline-none focus:border-amber-500" value="515">
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-slate-400 mb-1">Paint Kit Index</label>
              <input type="number" id="input-paint-kit" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 font-mono text-xs text-white focus:outline-none focus:border-amber-500" value="38">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[11px] font-semibold text-slate-400 mb-1">Float (Wear)</label>
              <input type="number" step="0.01" min="0" max="1" id="input-wear" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 font-mono text-xs text-white focus:outline-none focus:border-amber-500" value="0.01">
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-slate-400 mb-1">Pattern Seed</label>
              <input type="number" id="input-seed" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 font-mono text-xs text-white focus:outline-none focus:border-amber-500" value="41">
            </div>
          </div>

          <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Item Rarity</label>
            <select id="input-rarity" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500">
              <option value="2">Mil-Spec Grade (Blue)</option>
              <option value="3">Restricted (Purple)</option>
              <option value="4">Classified (Pink)</option>
              <option value="5">Covert (Red)</option>
              <option value="6" selected>★ Special Knife / Extraordinary (Gold)</option>
            </select>
          </div>

          <button onclick="addItemFromForm()" class="w-full mt-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs uppercase tracking-wider shadow-lg shadow-amber-500/10 transition">
            <i class="fa-solid fa-plus mr-1.5"></i> Add Item
          </button>

        </div>
      </div>

      <!-- RAW KEYVALUES INSPECTOR CARD -->
      <div class="glass-panel rounded-2xl p-5 space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center space-x-2">
            <i class="fa-solid fa-code text-amber-400"></i>
            <span>Live KeyValues Output</span>
          </h2>
          <span class="text-[10px] text-slate-500 font-mono">inventory.txt</span>
        </div>
        <textarea id="kv-output" class="w-full h-52 bg-slate-950/80 border border-slate-800/80 rounded-xl p-3 font-mono text-[11px] text-emerald-400 focus:outline-none resize-none leading-relaxed" readonly></textarea>
      </div>

    </div>

    <!-- RIGHT COLUMN: VISUAL INVENTORY GRID -->
    <div class="lg:col-span-8 space-y-5">
      
      <!-- INVENTORY BAR -->
      <div class="glass-panel rounded-2xl p-5 flex flex-wrap justify-between items-center gap-4">
        <div>
          <h2 class="text-base font-bold text-white uppercase tracking-wider flex items-center space-x-2">
            <i class="fa-solid fa-boxes-stacked text-amber-400"></i>
            <span>Equipped & Stored Items</span>
          </h2>
          <p id="inventory-count" class="text-xs text-slate-400 mt-0.5">0 items configured</p>
        </div>

        <button onclick="clearInventory()" class="bg-red-950/40 hover:bg-red-900/60 text-red-300 border border-red-800/60 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition">
          <i class="fa-solid fa-trash-can mr-1.5"></i> Clear Inventory
        </button>
      </div>

      <!-- ITEMS GRID -->
      <div id="inventory-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
        <!-- Rendered dynamically -->
      </div>

    </div>

  </main>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-6 right-6 bg-amber-500 text-slate-950 px-4 py-2.5 rounded-xl shadow-2xl font-bold text-xs transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none z-50 flex items-center space-x-2">
    <i class="fa-solid fa-circle-check text-sm"></i>
    <span id="toast-msg">Notification</span>
  </div>

  <script>
    // CATALOG & DEF MAPPING
    const PRESETS = {
      "515_38": { name: "Butterfly Knife | Fade", def_index: 515, paint_kit: 38, wear: 0.01, seed: 41, rarity: 6 },
      "515_418": { name: "Butterfly Knife | Doppler P1", def_index: 515, paint_kit: 418, wear: 0.02, seed: 120, rarity: 6 },
      "507_38": { name: "Karambit | Fade", def_index: 507, paint_kit: 38, wear: 0.01, seed: 80, rarity: 6 },
      "507_44": { name: "Karambit | Case Hardened", def_index: 507, paint_kit: 44, wear: 0.15, seed: 661, rarity: 6 },
      "508_419": { name: "M9 Bayonet | Doppler P2", def_index: 508, paint_kit: 419, wear: 0.03, seed: 21, rarity: 6 },
      "508_12": { name: "M9 Bayonet | Crimson Web", def_index: 508, paint_kit: 12, wear: 0.07, seed: 33, rarity: 6 },
      "500_415": { name: "Bayonet | Ruby", def_index: 500, paint_kit: 415, wear: 0.01, seed: 1, rarity: 6 },
      "506_38": { name: "Flip Knife | Fade", def_index: 506, paint_kit: 38, wear: 0.02, seed: 99, rarity: 6 },
      "505_418": { name: "Gut Knife | Doppler", def_index: 505, paint_kit: 418, wear: 0.03, seed: 15, rarity: 6 },
      "512_38": { name: "Huntsman Knife | Fade", def_index: 512, paint_kit: 38, wear: 0.01, seed: 50, rarity: 6 },
      "509_38": { name: "Falchion Knife | Fade", def_index: 509, paint_kit: 38, wear: 0.02, seed: 12, rarity: 6 },
      "516_12": { name: "Shadow Daggers | Crimson Web", def_index: 516, paint_kit: 12, wear: 0.08, seed: 4, rarity: 6 },
      "514_38": { name: "Bowie Knife | Fade", def_index: 514, paint_kit: 38, wear: 0.01, seed: 30, rarity: 6 },

      "7_38": { name: "AK-47 | Redline", def_index: 7, paint_kit: 38, wear: 0.15, seed: 10, rarity: 4 },
      "7_180": { name: "AK-47 | Fire Serpent", def_index: 7, paint_kit: 180, wear: 0.08, seed: 111, rarity: 5 },
      "7_300": { name: "AK-47 | Vulcan", def_index: 7, paint_kit: 300, wear: 0.05, seed: 44, rarity: 5 },
      "7_490": { name: "AK-47 | Frontside Misty", def_index: 7, paint_kit: 490, wear: 0.10, seed: 90, rarity: 4 },
      "16_255": { name: "M4A4 | Asiimov", def_index: 16, paint_kit: 255, wear: 0.22, seed: 32, rarity: 4 },
      "16_309": { name: "M4A4 | Howl", def_index: 16, paint_kit: 309, wear: 0.04, seed: 77, rarity: 5 },
      "60_440": { name: "M4A1-S | Golden Coil", def_index: 60, paint_kit: 440, wear: 0.05, seed: 23, rarity: 5 },
      "60_321": { name: "M4A1-S | Cyrex", def_index: 60, paint_kit: 321, wear: 0.02, seed: 18, rarity: 4 },
      "60_430": { name: "M4A1-S | Hyper Beast", def_index: 60, paint_kit: 430, wear: 0.06, seed: 5, rarity: 5 },
      "9_344": { name: "AWP | Dragon Lore", def_index: 9, paint_kit: 344, wear: 0.01, seed: 420, rarity: 5 },
      "9_279": { name: "AWP | Asiimov", def_index: 9, paint_kit: 279, wear: 0.18, seed: 13, rarity: 5 },
      "9_422": { name: "AWP | Hyper Beast", def_index: 9, paint_kit: 422, wear: 0.07, seed: 91, rarity: 5 },
      "9_38": { name: "AWP | Lightning Strike", def_index: 9, paint_kit: 38, wear: 0.01, seed: 2, rarity: 5 },

      "1_180": { name: "Desert Eagle | Hypnotic", def_index: 1, paint_kit: 180, wear: 0.01, seed: 8, rarity: 3 },
      "1_351": { name: "Desert Eagle | Conspiracy", def_index: 1, paint_kit: 351, wear: 0.03, seed: 14, rarity: 3 },
      "1_470": { name: "Desert Eagle | Sunset Storm", def_index: 1, paint_kit: 470, wear: 0.02, seed: 55, rarity: 4 },
      "4_38": { name: "Glock-18 | Fade", def_index: 4, paint_kit: 38, wear: 0.01, seed: 27, rarity: 4 },
      "4_353": { name: "Glock-18 | Water Elemental", def_index: 4, paint_kit: 353, wear: 0.06, seed: 3, rarity: 3 },
      "61_501": { name: "USP-S | Kill Confirmed", def_index: 61, paint_kit: 501, wear: 0.04, seed: 88, rarity: 5 },
      "19_233": { name: "P90 | Asiimov", def_index: 19, paint_kit: 233, wear: 0.05, seed: 62, rarity: 5 },

      "4001_0": { name: "CS:GO Weapon Case", def_index: 4001, paint_kit: 0, wear: 0, seed: 0, rarity: 0 },
      "4004_0": { name: "Operation Bravo Case", def_index: 4004, paint_kit: 0, wear: 0, seed: 0, rarity: 0 },
      "4008_0": { name: "eSports 2013 Winter Case", def_index: 4008, paint_kit: 0, wear: 0, seed: 0, rarity: 0 },
      "1201_0": { name: "CS:GO Case Key", def_index: 1201, paint_kit: 0, wear: 0, seed: 0, rarity: 0 }
    };

    const WEAPON_NAMES = {
      515: "Butterfly Knife", 507: "Karambit", 508: "M9 Bayonet", 500: "Bayonet",
      506: "Flip Knife", 505: "Gut Knife", 512: "Huntsman Knife", 509: "Falchion Knife",
      516: "Shadow Daggers", 514: "Bowie Knife", 7: "AK-47", 16: "M4A4", 60: "M4A1-S",
      9: "AWP", 1: "Desert Eagle", 4: "Glock-18", 61: "USP-S", 19: "P90", 4001: "Container Case", 1201: "Key"
    };

    // INVENTORY ARRAY STATE
    let inventory = [
      { id: 2, inventory_id: 1, def_index: 515, paint_kit: 38, wear: 0.01, seed: 41, rarity: 6, equipped: "3", name: "Butterfly Knife | Fade" },
      { id: 3, inventory_id: 2, def_index: 4001, paint_kit: 0, wear: 0, seed: 0, rarity: 0, equipped: "0", name: "CS:GO Weapon Case" },
      { id: 4, inventory_id: 3, def_index: 1201, paint_kit: 0, wear: 0, seed: 0, rarity: 0, equipped: "0", name: "CS:GO Case Key" },
      { id: 24, inventory_id: 16, def_index: 7, paint_kit: 38, wear: 0.15, seed: 10, rarity: 4, equipped: "2", name: "AK-47 | Redline" },
      { id: 25, inventory_id: 4, def_index: 16, paint_kit: 255, wear: 0.22, seed: 32, rarity: 4, equipped: "0", name: "M4A4 | Asiimov" }
    ];

    window.onload = function() {
      renderInventory();
    };

    function loadPresetItem() {
      const selectedVal = document.getElementById('preset-select').value;
      const preset = PRESETS[selectedVal];
      if (preset) {
        document.getElementById('input-def-index').value = preset.def_index;
        document.getElementById('input-paint-kit').value = preset.paint_kit;
        document.getElementById('input-wear').value = preset.wear;
        document.getElementById('input-seed').value = preset.seed;
        document.getElementById('input-rarity').value = preset.rarity;
      }
    }

    function addItemFromForm() {
      const def_index = parseInt(document.getElementById('input-def-index').value) || 7;
      const paint_kit = parseInt(document.getElementById('input-paint-kit').value) || 0;
      const wear = parseFloat(document.getElementById('input-wear').value) || 0.01;
      const seed = parseInt(document.getElementById('input-seed').value) || 1;
      const rarity = parseInt(document.getElementById('input-rarity').value) || 2;

      const weaponName = WEAPON_NAMES[def_index] || `Item #${def_index}`;
      const name = paint_kit > 0 ? `${weaponName} | Custom` : weaponName;

      const maxId = inventory.reduce((max, item) => Math.max(max, item.id), 1);
      const maxInvId = inventory.reduce((max, item) => Math.max(max, item.inventory_id), 0);

      inventory.push({
        id: maxId + 1,
        inventory_id: maxInvId + 1,
        def_index: def_index,
        paint_kit: paint_kit,
        wear: wear,
        seed: seed,
        rarity: rarity,
        equipped: "0",
        name: name
      });

      renderInventory();
      showToast("Item added successfully");
    }

    function deleteItem(id) {
      inventory = inventory.filter(i => i.id !== id);
      renderInventory();
      showToast("Item deleted");
    }

    function toggleEquip(id, side) {
      const item = inventory.find(i => i.id === id);
      if (item) {
        item.equipped = item.equipped === side ? "0" : side;
        renderInventory();
        showToast("Equip state updated");
      }
    }

    function clearInventory() {
      if (confirm("Clear all items from inventory?")) {
        inventory = [];
        renderInventory();
        showToast("Inventory cleared");
      }
    }

    function renderInventory() {
      const grid = document.getElementById('inventory-grid');
      const countEl = document.getElementById('inventory-count');
      grid.innerHTML = "";
      countEl.innerText = `${inventory.length} items configured`;

      if (inventory.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full glass-panel rounded-2xl p-10 text-center text-slate-500">
            <i class="fa-solid fa-box-open text-3xl mb-2 text-slate-600"></i>
            <p class="text-xs">Your inventory is empty. Add items using the panel on the left.</p>
          </div>
        `;
        updateKeyValuesOutput();
        return;
      }

      inventory.forEach(item => {
        const card = document.createElement('div');
        card.className = `glass-panel border-l-4 rounded-xl p-4 flex flex-col justify-between space-y-3 rarity-${item.rarity} rarity-bg-${item.rarity} relative overflow-hidden transition hover:translate-y-[-2px]`;

        let badge = "";
        if (item.equipped === "2") badge = `<span class="bg-amber-500 text-slate-950 font-black text-[9px] px-2 py-0.5 rounded uppercase">T Equipped</span>`;
        if (item.equipped === "3") badge = `<span class="bg-blue-500 text-white font-black text-[9px] px-2 py-0.5 rounded uppercase">CT Equipped</span>`;

        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <span class="text-[10px] text-slate-400 font-mono">ID: #${item.id} (Def ${item.def_index})</span>
              <h3 class="text-xs font-bold text-white tracking-wide mt-0.5">${item.name}</h3>
            </div>
            ${badge}
          </div>

          ${item.paint_kit > 0 ? `
            <div class="space-y-1 text-[11px] font-mono bg-slate-950/60 p-2 rounded-lg border border-slate-800/60">
              <div class="flex justify-between"><span class="text-slate-500">PaintKit:</span> <span class="text-amber-400">${item.paint_kit}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Float:</span> <span class="text-slate-300">${item.wear}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Seed:</span> <span class="text-slate-300">${item.seed}</span></div>
            </div>
          ` : `
            <div class="text-[11px] text-slate-500 italic py-1">Stock Item / Container</div>
          `}

          <div class="flex space-x-1.5 pt-2 border-t border-slate-800/60">
            <button onclick="toggleEquip(${item.id}, '2')" class="flex-1 bg-slate-800/80 hover:bg-amber-500/20 text-slate-300 hover:text-amber-400 py-1 rounded-lg text-[11px] font-semibold border border-slate-700/50 transition">
              T
            </button>
            <button onclick="toggleEquip(${item.id}, '3')" class="flex-1 bg-slate-800/80 hover:bg-blue-500/20 text-slate-300 hover:text-blue-400 py-1 rounded-lg text-[11px] font-semibold border border-slate-700/50 transition">
              CT
            </button>
            <button onclick="deleteItem(${item.id})" class="bg-red-950/40 hover:bg-red-900/60 text-red-300 px-2 py-1 rounded-lg text-[11px] border border-red-800/50 transition">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        `;

        grid.appendChild(card);
      });

      updateKeyValuesOutput();
    }

    function generateKeyValues() {
      let kv = `"items"\n{\n`;

      inventory.forEach(item => {
        kv += `\t"${item.id}"\n`;
        kv += `\t{\n`;
        kv += `\t\t"inventory"\t\t"${item.inventory_id}"\n`;
        kv += `\t\t"def_index"\t\t"${item.def_index}"\n`;
        kv += `\t\t"level"\t\t"1"\n`;
        kv += `\t\t"quality"\t\t"${item.rarity === 6 ? '3' : '4'}"\n`;
        kv += `\t\t"flags"\t\t"0"\n`;
        kv += `\t\t"origin"\t\t"24"\n`;
        kv += `\t\t"in_use"\t\t"0"\n`;
        kv += `\t\t"rarity"\t\t"${item.rarity}"\n`;

        if (item.paint_kit > 0) {
          kv += `\t\t"attributes"\n`;
          kv += `\t\t{\n`;
          kv += `\t\t\t"6"\t\t"${item.paint_kit}.000000"\n`;
          kv += `\t\t\t"7"\t\t"${item.seed}.000000"\n`;
          kv += `\t\t\t"8"\t\t"${item.wear.toFixed(6)}"\n`;
          kv += `\t\t}\n`;
        }

        if (item.equipped && item.equipped !== "0") {
          kv += `\t\t"equipped_state"\n`;
          kv += `\t\t{\n`;
          kv += `\t\t\t"${item.equipped}"\t\t"0"\n`;
          kv += `\t\t}\n`;
        }

        kv += `\t}\n`;
      });

      kv += `}\n`;
      kv += `"default_equips"\n{\n}\n`;

      return kv;
    }

    function updateKeyValuesOutput() {
      document.getElementById('kv-output').value = generateKeyValues();
    }

    function copyToClipboard() {
      navigator.clipboard.writeText(generateKeyValues()).then(() => {
        showToast("KeyValues copied to clipboard!");
      });
    }

    function downloadInventoryFile() {
      const blob = new Blob([generateKeyValues()], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'inventory.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("inventory.txt downloaded!");
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2500);
    }
  </script>
</body>
</html>
